[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/franc1sc0sv/tandem"

# Versiones fijadas para todo el workspace. Cada crate activa las features que necesite.
# Las de plataforma (windows, objc2*) se usan desde `[target.'cfg(windows)'.dependencies]`
# o `[target.'cfg(target_os = "macos")'.dependencies]` del crate, nunca en `[dependencies]`.
[workspace.dependencies]
# Portables
anyhow = "1.0.104"
arboard = "3.7.0"
bytes = "1"
# Directorios estándar de la app (datos, configuración) en cada sistema.
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
getrandom = "0.4.3"
keycode = "1.0.0"
mdns-sd = "0.21.5"
postcard = { version = "1.1.3", features = ["use-std"] }
# Solo pruebas: invariantes de planes, transacciones y protocolo.
proptest = "1.12.0"
# Sin `platform-verifier` (la confianza la da el pinning) y con ring como en rcgen,
# para no arrastrar aws-lc-rs (cmake/nasm en Windows).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
# 0.23 es la línea estable y la que usa quinn 0.11.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1.53.3"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8"

# Windows
windows = "0.62.2"

# macOS
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
