[workspace]
resolver = "3"
members = ["crates/*", "apps/tandem-ui/src-tauri"]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/franc1sc0sv/tandem"

# Pinned versions for the whole workspace. Each crate enables the features it needs.
# Platform ones (windows, objc2*) are used from `[target.'cfg(windows)'.dependencies]`
# or `[target.'cfg(target_os = "macos")'.dependencies]` of the crate, never in `[dependencies]`.
[workspace.dependencies]
# Portable
anyhow = "1.0.104"
arboard = "3.7.0"
# Hash of chunks and of whole files (T-106). `pure`: no C or hand-written SIMD, so it
# compiles the same on the three platforms.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
bytes = "1"
# Standard app directories (data, configuration) on each system.
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
getrandom = "0.4.3"
keycode = "1.0.0"
# Kill a tunnel's process group on Unix (T-104).
libc = "0.2"
mdns-sd = "0.21.5"
# Monitor control through the in-house firmware standard (DECISIONS A5, D12): repo
# `monitor-firmware`, develop branch, pinned by commit (T-109, monitor-firmware#1).
monitor-ddc = { git = "https://github.com/franc1sc0sv/monitor-firmware", rev = "364005d72b199f8e3106b3e966ce9d478c69da58" }
postcard = { version = "1.1.3", features = ["use-std"] }
# Tests only: invariants of plans, transactions and protocol.
if-addrs = { version = "0.15.0", features = ["link-local"] }
proptest = "1.12.0"
# Without `platform-verifier` (trust comes from pinning) and with ring as in rcgen,
# so as not to drag in aws-lc-rs (cmake/nasm on Windows).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
# Dual-stack UDP socket for the QUIC endpoint (T-196): Windows defaults to IPv6-only.
socket2 = "0.6"
# 0.23 is the stable line and the one quinn 0.11 uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
# CPU, RAM, disk and temperatures on the three systems (T-105). Without rayon or network/users.
sysinfo = { version = "0.40.4", default-features = false, features = ["component", "disk", "system"] }
# UI (apps/tandem-ui): only with the `app` feature, which needs WebKitGTK on Linux.
tauri = "2.12.4"
tauri-build = "2.7.3"
# Global UI shortcuts (T-042).
tauri-plugin-global-shortcut = "2.4.1"
# Automatic update from GitHub Releases, with its own minisign signature (T-122).
tauri-plugin-updater = "2.14.1"
tempfile = "3"
thiserror = "2"
tokio = "1.53.3"
toml = "0.9"
# Edit tandem.toml without losing the user's comments (T-080).
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8"

# Windows
windows = "0.62.2"
windows-core = "0.62.2"

# macOS. No default features (they pull in all the frameworks): each crate
# enables `std` and whatever it uses.
dispatch2 = { version = "0.3.1", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
