[workspace]
resolver = "3"
members = ["crates/*", "apps/tandem-ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/franc1sc0sv/tandem"

# Versiones fijadas para todo el workspace. Cada crate activa las features que necesite.
# Las de plataforma (windows, objc2*) se usan desde `[target.'cfg(windows)'.dependencies]`
# o `[target.'cfg(target_os = "macos")'.dependencies]` del crate, nunca en `[dependencies]`.
[workspace.dependencies]
# Portables
anyhow = "1.0.104"
arboard = "3.7.0"
# Hash de fragmentos y de archivos completos (T-106). `pure`: sin C ni SIMD a mano, para que
# compile igual en las tres plataformas.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
bytes = "1"
# Directorios estándar de la app (datos, configuración) en cada sistema.
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
getrandom = "0.4.3"
keycode = "1.0.0"
# Matar el grupo de procesos de un túnel en Unix (T-104).
libc = "0.2"
mdns-sd = "0.21.5"
# Control de monitores por el estándar del firmware propio (DECISIONS A5, D12): repo
# `monitor-firmware`, rama develop, fijado por commit (T-109, monitor-firmware#1).
monitor-ddc = { git = "https://github.com/franc1sc0sv/monitor-firmware", rev = "e850a2d4a63c26c100aa846970f8673afed39229" }
postcard = { version = "1.1.3", features = ["use-std"] }
# Solo pruebas: invariantes de planes, transacciones y protocolo.
if-addrs = { version = "0.15.0", features = ["link-local"] }
proptest = "1.12.0"
# Sin `platform-verifier` (la confianza la da el pinning) y con ring como en rcgen,
# para no arrastrar aws-lc-rs (cmake/nasm en Windows).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
# 0.23 es la línea estable y la que usa quinn 0.11.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
# CPU, RAM, disco y temperaturas en los tres sistemas (T-105). Sin rayon ni red/usuarios.
sysinfo = { version = "0.40.4", default-features = false, features = ["component", "disk", "system"] }
# UI (apps/tandem-ui): solo con la feature `app`, que necesita WebKitGTK en Linux.
tauri = "2.12.4"
tauri-build = "2.7.3"
# Atajos globales de la UI (T-042).
tauri-plugin-global-shortcut = "2.4.1"
# Actualización automática desde GitHub Releases, con firma minisign propia (T-122).
tauri-plugin-updater = "2.14.1"
tempfile = "3"
thiserror = "2"
tokio = "1.53.3"
toml = "0.9"
# Editar tandem.toml sin perder los comentarios del usuario (T-080).
toml_edit = "0.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8"

# Windows
windows = "0.62.2"
windows-core = "0.62.2"

# macOS. Sin features por defecto (arrastran todos los frameworks): cada crate
# activa `std` y lo que use.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
