<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem</title>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="11.5" cy="16" r="8" stroke="#7aa7e6" stroke-width="2.4" />
            <circle cx="20.5" cy="16" r="8" stroke="#a99be8" stroke-width="2.4" />
          </svg>
          Tandem
        </div>
        <span class="spacer"></span>
        <button type="button" class="pill btn" id="setup-btn" hidden aria-haspopup="dialog">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z" /><path d="m9 12 2 2 4-4" /></svg>
          Permisos
        </button>
        <button type="button" class="pill btn" id="keys-btn" hidden aria-haspopup="dialog">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2" /><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10" /></svg>
          Atajos
        </button>
        <span class="pill" id="agent-pill"><span class="dot warn" id="agent-dot"></span> <b id="agent-text">Conectando…</b></span>
        <button type="button" class="pill btn" id="link-pill" hidden aria-haspopup="dialog"><span class="dot warn" id="link-dot"></span> <b id="link-text"></b><span class="pact" id="link-act" hidden>Emparejar</span></button>
      </header>

      <main class="scene" id="scene" hidden>
        <section class="side mac" data-owner="mac" aria-label="MacBook Pro">
          <div class="side-head">
            <span class="name">MacBook Pro</span><span class="state" id="state-mac"></span>
            <span class="role" id="role-mac"></span>
          </div>
          <div class="desk" data-owner="mac"></div>
          <div class="machine">
            <div class="builtin">
              <svg class="hw" viewBox="0 0 220 110" aria-hidden="true">
                <rect x="32" y="4" width="156" height="92" rx="8" fill="#1c1e23" stroke="#33363e" />
                <rect id="lap-screen" x="40" y="11" width="140" height="78" rx="3" fill="#2d3e55" />
                <g id="lap-icon"></g>
                <path d="M10 98h200l-10 9H20z" fill="#22242a" stroke="#33363e" />
              </svg>
              <div class="seg" id="builtin-seg" role="radiogroup" aria-label="Pantalla de la Mac">
                <button type="button" role="radio" data-v="off" title="Apagada: las ventanas nunca van ahí" aria-label="Apagada">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M4 4l16 16" /></svg>
                </button>
                <button type="button" role="radio" data-v="mirror" title="Espejo de un monitor externo" aria-label="Espejo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="9" height="8" rx="1.5" /><rect x="13" y="6" width="9" height="8" rx="1.5" /><path d="M6.5 18h11" /></svg>
                </button>
                <button type="button" role="radio" data-v="extend" title="Extendida: pantalla independiente" aria-label="Extendida">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M9 20h6" /></svg>
                </button>
                <button type="button" data-v="gather" title="Traer ventanas: todavía no se puede pedir desde la ventana" aria-label="Traer ventanas" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h12M11 7l5 5-5 5M20 5v14" /></svg>
                </button>
              </div>
              <div class="bi-note" id="builtin-note"></div>
            </div>
            <div class="hub ghost" title="Hub USB: el agente todavía no informa dónde está">
              <svg viewBox="0 0 48 30" fill="none" aria-hidden="true"><rect x="2" y="6" width="44" height="18" rx="6" fill="#1c1e23" stroke="currentColor" /><rect x="9" y="12" width="6" height="6" rx="1.5" fill="currentColor" /><rect x="21" y="12" width="6" height="6" rx="1.5" fill="currentColor" /><rect x="33" y="12" width="6" height="6" rx="1.5" fill="currentColor" /></svg>hub USB
            </div>
          </div>
        </section>

        <section class="links" id="links" aria-label="Enlaces">
          <div class="link down" data-k="usb4" style="--c: var(--mac); --sp: 0.6s">
            <svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true"><line class="rail" x1="0" y1="17" x2="200" y2="17" /><line class="flow" x1="0" y1="17" x2="200" y2="17" /></svg>
            <span class="tag"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></svg><b>USB4</b> <span class="speed"></span></span>
          </div>
          <div class="link down" data-k="ethernet" style="--c: var(--ok); --sp: 1s">
            <svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true"><line class="rail" x1="0" y1="17" x2="200" y2="17" /><line class="flow" x1="0" y1="17" x2="200" y2="17" /></svg>
            <span class="tag"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4h14v10h-3v3h-2v3h-4v-3H8v-3H5z" /></svg><b>Ethernet</b> <span class="speed"></span></span>
          </div>
          <div class="link down" data-k="wifi" style="--c: var(--warn); --sp: 2s">
            <svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true"><line class="rail" x1="0" y1="17" x2="200" y2="17" /><line class="flow" x1="0" y1="17" x2="200" y2="17" /></svg>
            <span class="tag"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6.3 13.3l1.4 1.4a6 6 0 0 1 8.6 0l1.4-1.4a8 8 0 0 0-11.4 0zM2.8 9.8l1.4 1.4a11 11 0 0 1 15.6 0l1.4-1.4a13 13 0 0 0-18.4 0z" /></svg><b>Wi-Fi</b> <span class="plane">solo control</span></span>
          </div>
        </section>

        <section class="side pc" data-owner="pc" aria-label="PC">
          <div class="side-head">
            <span class="name">PC</span><span class="state" id="state-pc"></span>
            <span class="role" id="role-pc"></span>
          </div>
          <div class="desk" data-owner="pc"></div>
          <div class="machine">
            <div class="hub ghost" title="Hub USB: el agente todavía no informa dónde está">
              <svg viewBox="0 0 48 30" fill="none" aria-hidden="true"><rect x="2" y="6" width="44" height="18" rx="6" fill="#1c1e23" stroke="currentColor" /><rect x="9" y="12" width="6" height="6" rx="1.5" fill="currentColor" /><rect x="21" y="12" width="6" height="6" rx="1.5" fill="currentColor" /><rect x="33" y="12" width="6" height="6" rx="1.5" fill="currentColor" /></svg>hub USB
            </div>
            <svg class="hw" viewBox="0 0 90 120" aria-hidden="true"><rect x="8" y="4" width="74" height="112" rx="8" fill="#1c1e23" stroke="#33363e" /><rect x="16" y="14" width="40" height="92" rx="4" fill="#141518" stroke="#2a2c32" /><circle cx="36" cy="38" r="11" stroke="#4a4560" stroke-width="2" fill="none" /><circle cx="36" cy="78" r="11" stroke="#4a4560" stroke-width="2" fill="none" /><rect x="64" y="14" width="10" height="3" rx="1.5" fill="#a99be8" opacity=".7" /></svg>
            <button type="button" class="power" id="power">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8" /><path d="M6.3 6.8a8 8 0 1 0 11.4 0" /></svg>
            </button>
          </div>
        </section>
      </main>

      <main class="stage" id="stage" aria-live="polite" hidden></main>

      <footer class="bottom" id="bottom" hidden>
        <div class="modes" role="group" aria-label="Modos">
          <button type="button" class="mode" data-mode="mac">
            <div class="ico" aria-hidden="true"><span class="w" style="--c: var(--mac)"></span><span style="--c: var(--mac)"></span></div>
            <div class="t">Solo Mac</div><span class="k" aria-hidden="true"></span>
          </button>
          <button type="button" class="mode" data-mode="shared">
            <div class="ico" aria-hidden="true"><span class="w" style="--c: var(--pc)"></span><span style="--c: var(--mac)"></span></div>
            <div class="t">Compartido</div><span class="k" aria-hidden="true"></span>
          </button>
          <button type="button" class="mode" data-mode="pc">
            <div class="ico" aria-hidden="true"><span class="w" style="--c: var(--pc)"></span><span style="--c: var(--pc)"></span></div>
            <div class="t">Solo Windows</div><span class="k" aria-hidden="true"></span>
          </button>
        </div>
        <div class="services locked" id="services" aria-label="Servicios de datos">
          <button type="button" class="svc" disabled aria-label="Terminal SSH"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m5 8 4 4-4 4M12 16h7" /></svg><span class="tip">Terminal SSH</span></button>
          <button type="button" class="svc" disabled aria-label="Carpetas compartidas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg><span class="tip">Carpetas compartidas</span></button>
          <button type="button" class="svc" disabled aria-label="RTX 5080 (GPU remota)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="7" width="16" height="10" rx="2" /><path d="M8 7V4M12 7V4M16 7V4M8 20v-3M12 20v-3M16 20v-3" /></svg><span class="tip">RTX 5080 (GPU remota)</span></button>
          <button type="button" class="svc" disabled aria-label="Enviar archivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg><span class="tip">Enviar archivos</span></button>
          <span class="lock">requiere cable</span>
        </div>
      </footer>
    </div>

    <dialog class="keys" id="keys" aria-labelledby="keys-title">
      <h2 id="keys-title">Atajos globales</h2>
      <p class="kintro">Funcionan aunque Tandem esté en segundo plano. Haz clic en uno y pulsa la combinación nueva.</p>
      <p class="kwarn" id="keys-warning" hidden></p>
      <div class="klist" id="keys-list"></div>
      <p class="kfile" id="keys-file"></p>
      <div class="kfoot">
        <button type="button" class="kbtn" id="keys-reset">Restablecer</button>
        <span class="spacer"></span>
        <button type="button" class="kbtn" id="keys-cancel">Cancelar</button>
        <button type="button" class="kbtn primary" id="keys-save">Guardar</button>
      </div>
    </dialog>

    <dialog class="setup" id="setup" aria-labelledby="setup-title">
      <div class="sdots" id="setup-dots" aria-hidden="true"></div>
      <div class="sbody" id="setup-body" aria-live="polite"></div>
      <div class="kfoot">
        <button type="button" class="kbtn" id="setup-later">Más tarde</button>
        <span class="spacer"></span>
        <button type="button" class="kbtn" id="setup-back">Atrás</button>
        <button type="button" class="kbtn primary" id="setup-next">Siguiente</button>
      </div>
    </dialog>

    <dialog class="pair" id="pair" aria-labelledby="pair-title">
      <div class="pscene" id="pair-scene" data-line="idle" aria-hidden="true">
        <div class="ptile" data-m="mac">
          <svg viewBox="0 0 64 44" fill="none"><rect x="12" y="4" width="40" height="27" rx="3" stroke="currentColor" stroke-width="2.4" /><path d="M4 36h56l-4 4H8z" fill="currentColor" opacity=".8" /></svg>
          <span>Mac</span><em></em>
        </div>
        <div class="pline"><span class="rail"></span><span class="pulse"></span><span class="knot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
        </span></div>
        <div class="ptile" data-m="pc">
          <svg viewBox="0 0 64 44" fill="none"><rect x="20" y="2" width="24" height="40" rx="3" stroke="currentColor" stroke-width="2.4" /><circle cx="32" cy="14" r="4" stroke="currentColor" stroke-width="2" /><circle cx="32" cy="29" r="4" stroke="currentColor" stroke-width="2" /></svg>
          <span>PC</span><em></em>
        </div>
      </div>
      <div class="pbody" id="pair-body" aria-live="polite"></div>
      <div class="kfoot" id="pair-foot"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
