<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem</title>
  </head>
  <body class="tray">
    <div class="pop">
      <header class="ptop">
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="11.5" cy="16" r="8" stroke="#7aa7e6" stroke-width="2.4" />
            <circle cx="20.5" cy="16" r="8" stroke="#a99be8" stroke-width="2.4" />
          </svg>
          Tandem
        </div>
        <span class="spacer"></span>
        <span class="pstate"><span class="dot warn" id="agent-dot"></span> <span id="agent-text">Conectando…</span></span>
      </header>

      <main class="mini" id="mini" aria-label="Escena" hidden>
        <!-- Esta máquina y la otra (T-084): cuál es cuál lo decide el agente al conectarse. -->
        <section class="mside" data-side="here" aria-label="Esta máquina">
          <div class="mhead"><b data-part="name"></b><span data-part="state"></span></div>
          <div class="mdesk"></div>
        </section>
        <div class="mlink" aria-hidden="true"><span></span></div>
        <section class="mside" data-side="peer" aria-label="La otra máquina">
          <div class="mhead"><b data-part="name"></b><span data-part="state"></span></div>
          <div class="mdesk"></div>
        </section>
      </main>

      <main class="mstage" id="stage" aria-live="polite" hidden></main>

      <!-- Los modos dependen de los monitores: en pausa hasta el firmware propio (DESIGN §5). -->
      <div class="pmodes soon" id="modes" role="group" aria-label="Modos (próximamente)" title="Próximamente: firmware propio">
        <button type="button" class="pmode" disabled><span class="t">Solo Mac</span></button>
        <button type="button" class="pmode" disabled><span class="t">Compartido</span></button>
        <button type="button" class="pmode" disabled><span class="t">Solo Windows</span></button>
      </div>
      <p class="psoon">Monitores y modos: próximamente, con el firmware propio</p>

      <footer class="pfoot">
        <span class="pmsg" id="msg" role="status" aria-live="polite"></span>
        <button type="button" class="popen" id="open">Abrir Tandem</button>
      </footer>
    </div>
    <script type="module" src="/src/tray.ts"></script>
  </body>
</html>
