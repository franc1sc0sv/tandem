notes = """
Declara 60 = {12, 0F, 10} en el capabilities string, pero no obedece esos valores.
0x03 también lleva a HDMI. 0x09 estando ya en DP re-sincroniza (1-2 s en negro).
La lectura de 0x60 no sirve para saber en qué entrada está: siempre da 0x09."""
