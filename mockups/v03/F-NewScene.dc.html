<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenes: new scene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0f12}
a{color:#9cc0f0}
.mut{color:#9a9da6}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.btn{font:inherit;font-size:13.5px;padding:10px 18px;border-radius:10px;border:1px solid #31343b;background:#1b1c21;color:#e8e8eb;cursor:pointer;min-height:44px}
.pri{background:#22324a;border-color:#7aa7e6}
.seg{display:flex;padding:3px;border-radius:10px;background:#111215;border:1px solid #25272d;gap:3px;flex-wrap:wrap}
.sb{flex:1;font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:0;background:transparent;color:#9a9da6;cursor:pointer;min-height:38px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s}
.lbl{font-size:12px;color:#9a9da6}
.scr{border-radius:9px;padding:6px;background:#0b0c0e;border:1px solid #31343b;box-sizing:border-box}
.wall{width:100%;height:100%;border-radius:4px;transition:background .6s cubic-bezier(.2,.8,.2,1)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 14px;border-radius:9px;border:1px dashed #4a4e58;background:#111215;color:#e8e8eb;min-width:120px;text-align:center;animation:bd 1.6s ease-in-out infinite}
@keyframes bd{50%{border-color:#7aa7e6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-height:0;padding:0 16px;box-sizing:border-box;flex:none;align-self:center;white-space:nowrap;font:inherit;font-size:13.5px;font-weight:500;line-height:1;border-radius:10px;border:1px solid #2e3138;background:linear-gradient(180deg,#1f2025,#18191d);color:#e8e8eb;cursor:pointer;text-decoration:none!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.3);transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s;position:relative;overflow:hidden}
.btn svg{width:16px;height:16px;flex:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.btn:hover{border-color:#41454e;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.35)}
.btn:hover svg{transform:scale(1.14)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #7aa7e6;outline-offset:2px}
.btn.pri{background:linear-gradient(180deg,#3a6aa8,#2c5288)!important;border-color:#5b8fd4!important;color:#fff}
.btn.pri:hover{box-shadow:0 0 0 4px rgba(122,167,230,.16),0 8px 20px rgba(44,82,136,.45)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn.pri:hover::after{transform:translateX(120%)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:#9a9da6}
.btn.ghost:hover{background:#1f2026;color:#e8e8eb}
.seg{position:relative}
.sb svg{width:16px;height:16px}
.scr{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
input{transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:#5b8fd4!important;box-shadow:0 0 0 4px rgba(122,167,230,.15)}
</style>
</helmet>
<div style="width:100%;min-height:860px;box-sizing:border-box;padding:24px 32px;display:flex;flex-direction:column;gap:18px;font-family:'Inter',system-ui,sans-serif;color:#e8e8eb;font-size:14px;background:#0e0f12">
  <nav aria-label="Path" style="font-size:12.5px" class="mut"><a href="V3-Monitors.dc.html">Monitors</a> › New scene</nav>
  <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
    <section style="flex:1 1 460px;min-width:0;display:flex;flex-direction:column;gap:18px">
      <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Name</span><input value="Game" style="font:inherit;font-size:16px;color:#e8e8eb;background:#111215;border:1px solid #31343b;border-radius:10px;padding:12px 14px"></label>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Odyssey G5 34" shows</span>
        <div class="seg" role="radiogroup" aria-label="What the 34" shows">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" class="sb" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}"><span style="{{o.dot}}"></span>{{o.name}}</button></sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Shortcut</span>
        <div style="display:flex;gap:10px;align-items:center"><span class="kbd">⌃⌥4</span><span class="mut" style="font-size:12.5px">Press the new combination. It works on any machine of the desk.</span></div>
      </div>
      <div style="display:flex;gap:10px"><a class="btn ghost" href="V3-Monitors.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Cancel</a><span style="flex:1"></span><a class="btn" href="F-Transactions.dc.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Save and apply</a><a class="btn pri" href="V3-Monitors.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>Save</a></div>
    </section>

    <section aria-label="Preview" style="flex:1 1 380px;min-width:0;border-radius:14px;background:#15161a;border:1px solid #25272d;padding:22px;display:flex;flex-direction:column;gap:16px;align-items:center">
      <span class="lbl" style="align-self:flex-start">Preview</span>
      <div style="display:flex;align-items:flex-end;gap:22px;padding:16px 0">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
          <div class="scr" style="width:300px;height:126px"><div class="wall" style="{{wall}}"></div></div>
          <div style="width:8px;height:16px;background:#22242a"></div><div style="width:80px;height:5px;border-radius:4px;background:#22242a"></div>
          <span style="font-size:12.5px">34" · <b style="font-weight:600">{{showName}}</b></span>
        </div>
      </div>
      <p class="mut" style="margin:0;font-size:12.5px;line-height:1.5;text-align:center;max-width:340px">When applied, each monitor confirms its change. If one fails, the whole scene is rolled back.</p>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { o: 'pc', k: 'pc' }; }
  renderVals() {
    const o = [['mbp', 'MacBook Pro', '#7aa7e6', 'linear-gradient(160deg,#34496a,#222d3d)'], ['pc', 'PC-Desktop', '#a99be8', 'linear-gradient(160deg,#463d63,#2a2539)'], ['keep', 'Keep as is', '#6a6d76', 'repeating-linear-gradient(45deg,#1b1c21 0 8px,#15161a 8px 16px)']];
    const k = [['hub', 'Follows the hub'], ['mbp', 'MacBook Pro'], ['pc', 'PC-Desktop']];
    const cur = o.find((x) => x[0] === this.state.o);
    const sel = 'background:#1c1d22;color:#e8e8eb;box-shadow:inset 0 0 0 1px #4a4e58';
    return {
      wall: 'background:' + cur[3], showName: cur[1],
      kName: k.find((x) => x[0] === this.state.k)[1],
      opts: o.map(([id, name, c]) => ({ name, on: id === this.state.o ? 'true' : 'false', style: id === this.state.o ? sel : '',
        dot: 'width:8px;height:8px;border-radius:50%;background:' + c, pick: () => this.setState({ o: id }) })),
      kopts: k.map(([id, name]) => ({ name, on: id === this.state.k ? 'true' : 'false', style: id === this.state.k ? sel : '', pick: () => this.setState({ k: id }) }))
    };
  }
}
</script>
</body>
</html>
