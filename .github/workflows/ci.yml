name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Higiene del repo público (T-162) y comentarios SAFETY (T-165) y estado de tareas (T-193).
      - if: runner.os == 'Linux'
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: scripts/ci/privacidad.sh && scripts/ci/safety.sh && scripts/ci/tareas.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: cargo test
        timeout-minutes: 20
        run: cargo test --workspace
      # Scripts del workflow de release (notas y versión); bash 4+, por eso solo en Linux.
      - if: runner.os == 'Linux'
        run: scripts/release/test.sh

  # La app de Tauri (feature `app`) se compila aparte, con el frontend ya construido
  # (`frontendDist`), en los tres sistemas: la barra de menú (macOS), la bandeja (Windows) y
  # los atajos globales tienen código propio de cada uno. En Linux necesita WebKitGTK. La
  # lógica portable de tandem-ui ya corre en la matriz de arriba.
  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/tandem-ui
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo clippy -p tandem-ui --features app --all-targets
      - run: cargo build -p tandem-ui --features app

  # Mockups de v0.3 (T-125): renderiza mockups/v03 con el support.js propio en Chromium
  # headless, prueba el renderizador y la comparación de capturas, y sube las capturas (cada
  # mockup y cada estado con nombre) como artefacto. Al final las compara con las de
  # docs/mockups-png: la captura es determinista en una máquina (sin red, fuentes empaquetadas,
  # Chromium fijado por el lockfile y sin partial raster) y entre máquinas solo puede variar
  # dentro de la tolerancia de compare(), así que si baja de 0.999 es que un mockup cambió sin regenerarlas
  # (`pnpm mockups:shot`); las diferencias quedan en el artefacto `mockups-diff`.
  mockups:
    name: ui (mockups)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/mockup-render
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/mockup-render/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/mockup-render/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - name: Capturas
        run: pnpm mockups:shot --out "$RUNNER_TEMP/mockups-png"
      - uses: actions/upload-artifact@v4
        with:
          name: mockups-png
          path: ${{ runner.temp }}/mockups-png
          if-no-files-found: error
      - name: Comparar con docs/mockups-png
        id: comparar
        run: |
          set -o pipefail
          node src/cli/compare.ts --dirs ../../docs/mockups-png "$RUNNER_TEMP/mockups-png" \
            --min 0.999 --diff-dir "$RUNNER_TEMP/mockups-diff" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure() && steps.comparar.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mockups-diff
          path: ${{ runner.temp }}/mockups-diff

  # Capturas de la app (T-112): construye el modo demo, toma cada pantalla en Chromium
  # headless igual que los mockups (sin red, fuentes empaquetadas) y la compara con
  # docs/mockups-png. Falla si la barra lateral no llega a la similitud pedida (≥ 0.99, peor
  # cuadro ≥ 0.97) o si una pantalla muestra errores; las capturas y las diferencias quedan
  # como artefactos.
  capturas:
    name: ui (capturas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/tandem-ui/pnpm-lock.yaml
            tools/mockup-render/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tools/mockup-render
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/tandem-ui
      - run: pnpm check:scripts
        working-directory: apps/tandem-ui
      - name: Capturas y comparación
        working-directory: apps/tandem-ui
        run: |
          set -o pipefail
          pnpm shots --check --diff-dir "$RUNNER_TEMP/app-diff" | tee -a "$GITHUB_STEP_SUMMARY"
      # Las capturas versionadas deben ser las de la app actual (T-172): si regenerar las cambia,
      # hay que correr `pnpm shots` en apps/tandem-ui y commitear docs/screenshots/v03.
      - name: Capturas versionadas al día
        run: |
          estado="$(git status --porcelain -- docs/screenshots/v03)"
          if [ -n "$estado" ]; then
            echo "docs/screenshots/v03 está desactualizado; corre 'pnpm shots' y commitea:"
            echo "$estado"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            docs/screenshots/v03
            ${{ runner.temp }}/app-diff

  # El instalador de macOS (T-070): Tandem.app con tandemd dentro y el .dmg, firmados ad-hoc
  # (sin secretos en CI). El script además comprueba el sidecar, el Info.plist y la firma.
  bundle-macos:
    name: dmg (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - run: scripts/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-macos-dmg
          path: target/*-apple-darwin/release/bundle/dmg/Tandem_*.dmg
          if-no-files-found: error

  # Instalador NSIS de Windows (T-071): lo construye, lo sube como artefacto y lo prueba de
  # punta a punta (instalar, arranque con la sesión, reinstalar, desinstalar) en el runner.
  installer-windows:
    name: instalador (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - name: Construir el instalador
        id: build
        shell: pwsh
        run: ./tools/windows/installer/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Probar instalar y desinstalar
        shell: pwsh
        run: ./tools/windows/installer/test-installer.ps1 -Installer "${{ steps.build.outputs.installer }}"

  # Informativo: no bloquea el merge. Objetivo ≥ 80 % en los crates portables (docs/TESTING.md).
  coverage:
    name: cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --html --output-dir coverage
      - name: Resumen en la página del job
        run: |
          { echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            lcov.info
            coverage/html
