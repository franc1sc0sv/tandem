name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Public repo hygiene (T-162), SAFETY comments (T-165) and task status (T-193).
      - if: runner.os == 'Linux'
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: scripts/ci/privacy.sh && scripts/ci/safety.sh && scripts/ci/tasks.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: cargo test
        timeout-minutes: 20
        run: cargo test --workspace
      # Release workflow scripts (notes and version); bash 4+, hence Linux only.
      - if: runner.os == 'Linux'
        run: scripts/release/test.sh

  # The Tauri app (feature `app`) is built separately, with the frontend already built
  # (`frontendDist`), on all three systems: the menu bar (macOS), the tray (Windows) and
  # the global shortcuts each have their own code. On Linux it needs WebKitGTK. The
  # portable logic of tandem-ui already runs in the matrix above.
  ui:
    name: ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/tandem-ui
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo clippy -p tandem-ui --features app --all-targets
      - run: cargo build -p tandem-ui --features app

  # v0.3 mockups (T-125): renders mockups/v03 with the project's own support.js in headless
  # Chromium, tests the renderer and the screenshot comparison, and uploads the screenshots (each
  # mockup and each named state) as an artifact. At the end it compares them with those in
  # docs/mockups-png: the capture is deterministic on one machine (no network, bundled fonts,
  # Chromium pinned by the lockfile and no partial raster) and across machines it can only vary
  # within compare()'s tolerance, so if it drops below 0.999 a mockup changed without regenerating them
  # (`pnpm mockups:shot`); the differences are left in the `mockups-diff` artifact.
  mockups:
    name: ui (mockups)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/mockup-render
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/mockup-render/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/mockup-render/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - name: Screenshots
        run: pnpm mockups:shot --out "$RUNNER_TEMP/mockups-png"
      - uses: actions/upload-artifact@v4
        with:
          name: mockups-png
          path: ${{ runner.temp }}/mockups-png
          if-no-files-found: error
      - name: Compare with docs/mockups-png
        id: compare
        run: |
          set -o pipefail
          node src/cli/compare.ts --dirs ../../docs/mockups-png "$RUNNER_TEMP/mockups-png" \
            --min 0.999 --diff-dir "$RUNNER_TEMP/mockups-diff" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mockups-diff
          path: ${{ runner.temp }}/mockups-diff

  # App screenshots (T-112): builds the demo mode, takes each screen in headless Chromium
  # like the mockups (no network, bundled fonts) and compares it with
  # docs/mockups-png. Fails if the sidebar does not reach the required similarity (>= 0.99, worst
  # tile >= 0.97) or if a screen shows errors; the screenshots and the differences are left
  # as artifacts.
  screenshots:
    name: ui (screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/tandem-ui/pnpm-lock.yaml
            tools/mockup-render/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tools/mockup-render
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/tandem-ui
      - run: pnpm check:scripts
        working-directory: apps/tandem-ui
      - name: Screenshots and comparison
        working-directory: apps/tandem-ui
        run: |
          set -o pipefail
          pnpm shots --check --diff-dir "$RUNNER_TEMP/app-diff" | tee -a "$GITHUB_STEP_SUMMARY"
      # The versioned screenshots must be those of the current app (T-172): if regenerating them changes them,
      # run `pnpm shots` in apps/tandem-ui and commit docs/screenshots/v03.
      - name: Versioned screenshots up to date
        run: |
          state="$(git status --porcelain -- docs/screenshots/v03)"
          if [ -n "$state" ]; then
            echo "docs/screenshots/v03 is out of date; run 'pnpm shots' and commit:"
            echo "$state"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            docs/screenshots/v03
            ${{ runner.temp }}/app-diff

  # The macOS installer (T-070): Tandem.app with tandemd inside and the .dmg, signed ad-hoc
  # (no secrets in CI). The script also checks the sidecar, the Info.plist and the signature.
  bundle-macos:
    name: dmg (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - run: scripts/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-macos-dmg
          path: target/*-apple-darwin/release/bundle/dmg/Tandem_*.dmg
          if-no-files-found: error

  # Windows NSIS installer (T-071): builds it, uploads it as an artifact and tests it end to
  # end (install, startup with the session, reinstall, uninstall) on the runner.
  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - name: Build the installer
        id: build
        shell: pwsh
        run: ./tools/windows/installer/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Test install and uninstall
        shell: pwsh
        run: ./tools/windows/installer/test-installer.ps1 -Installer "${{ steps.build.outputs.installer }}"

  # Informational: does not block the merge. Target >= 80 % on the portable crates (docs/TESTING.md).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --html --output-dir coverage
      - name: Summary on the job page
        run: |
          { echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
