name: Release

# Construye los instaladores de macOS (.dmg) y Windows (NSIS), los paquetes firmados del
# updater (T-122), sus checksums, las notas y el `latest.json`, y crea el release en GitHub.
# Ver docs/dev/release.md.
#
# - Tag `v*` empujado: release de ese tag (tiene que coincidir con la versión). Se crea en
#   borrador con todo subido y, si es una versión final (`v0.3.0`), se publica al terminar;
#   una prerelease (`v0.3.0-rc.1`) queda en borrador para probarla a mano.
# - A mano (workflow_dispatch): por omisión en modo prueba, que deja todo como artefactos del
#   workflow y no crea ningún release ni tag.
# - PR que toque este workflow, scripts/release o la config del updater: siempre en modo prueba.
#
# Los paquetes del updater se firman con la llave minisign del secreto
# TAURI_SIGNING_PRIVATE_KEY (y TAURI_SIGNING_PRIVATE_KEY_PASSWORD si tiene clave). Sin el
# secreto, un release falla en `preparar` con el motivo; el modo prueba firma con una llave
# desechable para probar todo el camino.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Modo prueba: solo artefactos, sin crear el release'
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - apps/tandem-ui/src-tauri/tauri.updater.json

# Solo el job `release` (que no corre en modo prueba) recibe permiso de escritura.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preparar:
    name: preparar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.modo.outputs.version }}
      tag: ${{ steps.modo.outputs.tag }}
      publicar: ${{ steps.modo.outputs.publicar }}
      prerelease: ${{ steps.modo.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # las notas recorren la historia desde el tag anterior
      - run: scripts/release/test.sh
      - name: Versión y modo
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PRUEBA: ${{ inputs.prueba }}
          HAY_LLAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          publicar=false
          if [ "$EVENTO" = push ] && [ "$REF_TYPE" = tag ]; then
            version=$(scripts/release/version.sh "$REF_NAME")
            tag=$REF_NAME
            publicar=true
          else
            version=$(scripts/release/version.sh)
            tag=v$version
            # Solo publica si alguien desmarcó «modo prueba» a mano; cualquier otro valor es prueba.
            if [ "$EVENTO" = workflow_dispatch ] && [ "$PRUEBA" = false ]; then
              scripts/release/version.sh "$tag" >/dev/null
              publicar=true
            fi
          fi
          # SemVer: con un sufijo (`-rc.1`) es una prerelease.
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$publicar" = true ] && [ "$HAY_LLAVE" != true ]; then
            echo "::error title=Falta la llave del updater::El release necesita el secreto TAURI_SIGNING_PRIVATE_KEY (la llave minisign del updater) para firmar los paquetes. Cómo crearla y guardarla: docs/dev/release.md#llave-del-updater"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publicar=$publicar"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          if [ "$publicar" = true ]; then
            echo "Release: $tag (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Modo prueba: $tag, solo artefactos (sin release)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notas
        env:
          VERSION: ${{ steps.modo.outputs.version }}
        run: |
          scripts/release/notes.sh --version "$VERSION" --hasta HEAD > notas.md
          cat notas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: notas
          path: notas.md
          if-no-files-found: error

  # Lo mismo que el job `dmg (macos-latest)` del CI (T-070), más el paquete del updater
  # (`Tandem.app.tar.gz` y su firma). Firma de código ad-hoc salvo que haya variables de firma
  # de Apple (docs/dev/install-macos.md).
  macos:
    name: dmg (macos-latest)
    needs: preparar
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - name: Llave desechable (modo prueba sin secreto)
        if: needs.preparar.outputs.publicar != 'true'
        working-directory: apps/tandem-ui
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/prueba.key" >/dev/null
          echo "PRUEBA_LLAVE=$(cat "$RUNNER_TEMP/prueba.key")" >> "$GITHUB_ENV"
      - name: Construir
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.PRUEBA_LLAVE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: scripts/macos/bundle.sh --config src-tauri/tauri.updater.json
      # upload-artifact conserva las carpetas a partir del primer comodín
      # (`aarch64-apple-darwin/release/...`): se copia aparte para que todo quede en la raíz.
      - name: Juntar
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          bundle=$(echo target/*-apple-darwin/release/bundle)
          arch=$(basename "$(dirname "$(dirname "$bundle")")" | cut -d- -f1)
          cp "$bundle"/dmg/Tandem_*.dmg dist/
          paquete="dist/Tandem_${VERSION}_${arch}.app.tar.gz"
          cp "$bundle/macos/Tandem.app.tar.gz" "$paquete"
          cp "$bundle/macos/Tandem.app.tar.gz.sig" "$paquete.sig"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: dist/*
          if-no-files-found: error

  # Lo mismo que el job `instalador (windows)` del CI (T-071), con la prueba de instalar y
  # desinstalar: no se publica un instalador que no se probó. Con la firma del updater, el
  # mismo instalador es el paquete que baja el updater.
  windows:
    name: instalador (windows)
    needs: preparar
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/tandem-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tandem-ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: pnpm install --frozen-lockfile
        working-directory: apps/tandem-ui
      - name: Llave desechable (modo prueba sin secreto)
        if: needs.preparar.outputs.publicar != 'true'
        shell: bash
        working-directory: apps/tandem-ui
        run: |
          pnpm tauri signer generate --ci -w "$RUNNER_TEMP/prueba.key" >/dev/null
          echo "PRUEBA_LLAVE=$(cat "$RUNNER_TEMP/prueba.key")" >> "$GITHUB_ENV"
      - name: Construir el instalador
        id: build
        shell: pwsh
        env:
          TANDEM_UPDATER_ARTIFACTS: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.PRUEBA_LLAVE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./tools/windows/installer/build-installer.ps1
      - name: Probar instalar y desinstalar
        shell: pwsh
        run: ./tools/windows/installer/test-installer.ps1 -Installer "${{ steps.build.outputs.installer }}"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            ${{ steps.build.outputs.installer }}
            ${{ steps.build.outputs.installer }}.sig
          if-no-files-found: error

  # Junta todo, comprueba que hay exactamente un paquete de cada tipo con su firma, genera los
  # checksums y `latest.json`. El artefacto `tandem-<versión>` es lo que se publicaría.
  artefactos:
    name: checksums y latest.json
    needs: [preparar, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notas
      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          ls -la
          dmg=(Tandem_*.dmg) exe=(Tandem_*-setup.exe) app=(Tandem_*.app.tar.gz)
          [ ${#dmg[@]} -eq 1 ] || { echo "se esperaba un .dmg: ${dmg[*]}" >&2; exit 1; }
          [ ${#exe[@]} -eq 1 ] || { echo "se esperaba un -setup.exe: ${exe[*]}" >&2; exit 1; }
          [ ${#app[@]} -eq 1 ] || { echo "se esperaba un .app.tar.gz: ${app[*]}" >&2; exit 1; }
          sha256sum "${dmg[0]}" "${exe[0]}" "${app[0]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          { echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: latest.json
        env:
          VERSION: ${{ needs.preparar.outputs.version }}
          TAG: ${{ needs.preparar.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          app=(dist/Tandem_*.app.tar.gz) exe=(dist/Tandem_*-setup.exe)
          # El nombre lleva la arquitectura del runner (`aarch64` hoy, ver docs/dev/release.md).
          arch=$(basename "${app[0]}" .app.tar.gz); arch=${arch##*_}
          scripts/release/latest-json.sh --version "$VERSION" --repo "$REPO" --tag "$TAG" \
            --notas notas.md "darwin-$arch=${app[0]}" "windows-x86_64=${exe[0]}" > dist/latest.json
          { echo '```json'; cat dist/latest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-${{ needs.preparar.outputs.version }}
          path: |
            dist/*
            notas.md
          if-no-files-found: error

  release:
    name: release
    needs: [preparar, artefactos]
    if: needs.preparar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tandem-${{ needs.preparar.outputs.version }}
      - name: Crear el release en borrador y publicarlo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preparar.outputs.tag }}
          VERSION: ${{ needs.preparar.outputs.version }}
          PRERELEASE: ${{ needs.preparar.outputs.prerelease }}
          TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ya hay un release $TAG: bórralo (si es un borrador) y vuelve a correr el workflow" >&2
            exit 1
          fi
          # Con un tag empujado, el release es de ese tag. A mano, el tag v<versión> lo crea
          # GitHub en este commit al publicar.
          extra=()
          [ "$TAG_PUSH" = true ] && extra+=(--verify-tag)
          [ "$PRERELEASE" = true ] && extra+=(--prerelease)
          # Primero en borrador con todo subido: el updater nunca ve un release a medias.
          gh release create "$TAG" --draft "${extra[@]}" --target "$GITHUB_SHA" \
            --title "Tandem $VERSION" --notes-file notas.md \
            dist/Tandem_*.dmg dist/Tandem_*-setup.exe dist/Tandem_*.app.tar.gz dist/*.sig \
            dist/latest.json dist/SHA256SUMS.txt
          if [ "$PRERELEASE" = true ]; then
            echo "Prerelease $TAG en borrador: se publica a mano después de probarla" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$TAG" --draft=false --latest
            echo "Publicado $TAG: el updater lo ve desde ya" >> "$GITHUB_STEP_SUMMARY"
          fi
