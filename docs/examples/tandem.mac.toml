# tandem.toml de la Mac. Va en ~/Library/Application Support/Tandem/tandem.toml
# (o donde diga `tandemd --config`). Se valida con `tandemd --check-config <archivo>`.
#
# El puesto ([[monitors]]) es el mismo en las dos máquinas; cambian `machine`, las
# direcciones del otro agente y lo que solo hace la Mac (Wake-on-LAN, pc_lost_after).
#
# En el directorio de datos el agente guarda:
# - identity.key: su llave Ed25519. Se crea sola la primera vez; no se comparte.
# - trust.toml: las llaves de los pares emparejados. Sin par, el agente trabaja solo
#   y la UI lo indica. Se llena al emparejar desde la UI (píldora del enlace →
#   «Emparejar», en las dos máquinas, y comparar el código).

machine = "mac"

[network]
# Puerto UDP (QUIC) de los dos agentes.
port = 47770
# Donde la PC espera mientras se empareja (por omisión, port + 1).
# pairing_port = 47771
# La PC en cada enlace directo (DESIGN §6), de mayor a menor prioridad. La LAN de casa
# (Wi-Fi) no hace falta fijarla: se descubre por mDNS.
peers = [
    { kind = "usb4", addr = "10.77.1.2:47770" },
    { kind = "ethernet", addr = "10.77.2.2:47770" },
]

[orchestrator]
# Encender la PC y esperar a que su agente responda.
power_on_timeout_secs = 120
step_timeout_secs = 10

[power]
# Sin ningún enlace con la PC durante esto, se la da por apagada (corte de corriente).
pc_lost_after_secs = 15

# Wake-on-LAN por el Ethernet directo: la MAC de la tarjeta de la PC, la IP de la Mac
# en ese enlace y el broadcast de su subred.
[power.wol]
mac = "9c:6b:00:1a:2b:ff"
source = "10.77.2.1"
broadcast = "10.77.2.3"

[input]
# Quién tiene el teclado y el mouse al arrancar, hasta que el hub decida (DESIGN §7).
server = "mac"
# Bloquea el cursor en la máquina donde está (nombres de KeyboardEvent.code, todas a
# la vez). ScrollLock de un teclado de PC llega a la Mac como F14 y vale igual.
lock_shortcut = ["ScrollLock"]
clipboard = true

# El teclado y el mouse que viajan en el hub USB-C, por VID:PID (en Windows, el
# Administrador de dispositivos; en macOS, Información del sistema → USB). El servidor es
# la máquina donde aparecen. Sin esta sección los roles no cambian solos.
[input.hub]
keyboard = "046d:c33f"
mouse = "046d:c539"

# Cmd↔Ctrl ya es lo predeterminado; para cambiarlo, una tabla por dirección con los ocho
# modificadores, por ejemplo [input.remap.mac_to_win] meta_left = "control_left", ...

[[monitors]]
id = "m34"
label = '34"'
edid_model = "LC34G55T"
wiring = { pc = "displayport", mac = "hdmi" }
ddc = { hdmi = 0x06, display_port = 0x09 }

[[monitors]]
id = "m32"
label = '32"'
# El EDID solo dice "Odyssey G5" (id PnP SAM7489); códigos DDC verificados en T-050.
edid_model = "Odyssey G5"
wiring = { pc = "displayport", mac = "hdmi" }
ddc = { hdmi = 0x05, display_port = 0x0F }
