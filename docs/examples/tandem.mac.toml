# tandem.toml of a Mac. It lives in ~/Library/Application Support/Tandem/tandem.toml
# (or wherever `tandemd --config` says). Validate it with `tandemd --check-config <file>`.
#
# It does not need to be written by hand: if it does not exist, tandemd generates it at
# startup with an empty desk (T-082), and everything is configured from the UI (DECISIONS
# D4). This example shows every option.
#
# The two machines are equal (DECISIONS D1, D2, A1): neither is "the Mac" or "the PC" as
# far as the code is concerned. Each one is a side, `a` or `b`, and the public keys decide
# the side when pairing (the lower one is `a`). In this example the Mac ended up as `a`; if
# it had ended up as `b`, the agent swaps the sides by itself and rewrites this file.
# What is known about each machine (system, name, color) goes in [machines].
#
# The v0.2 format, with `mac`/`pc` sides, still loads: it is translated on its own
# (examples in docs/examples/v0.2/).
#
# In the data directory the agent keeps:
# - identity.key: its Ed25519 key. It is created on the first run; it is never shared.
# - trust.toml: the keys of the paired peers. With no peer, the agent works alone
#   and the UI says so. It is filled in when pairing from the UI (on both machines, and
#   comparing the code).

machine = "a"

[network]
# UDP (QUIC) port of the two agents.
port = 52000
# Where it listens while pairing (default: port + 1).
# pairing_port = 52001
# The other machine on each direct link (DESIGN §6), from highest to lowest priority. The
# home LAN (Wi-Fi) does not need to be set: it is discovered through mDNS.
peers = [
    { kind = "usb4", addr = "10.77.1.2:52000" },
    { kind = "ethernet", addr = "10.77.2.2:52000" },
]

[orchestrator]
# Power on the other machine and wait for its agent to answer.
power_on_timeout_secs = 120
step_timeout_secs = 10

[power]
# With no link to the other machine for this long, it is considered powered off.
peer_lost_after_secs = 15
# This machine wakes up through Wake-on-LAN from sleep ("Wake for network access").
wakeable = true

# Wake-on-LAN over the direct Ethernet: the MAC of the other machine's card, this
# machine's IP on that link and the broadcast address of its subnet.
[power.wol]
mac = "aa:bb:cc:dd:ee:ff"
source = "10.77.2.1"
broadcast = "10.77.2.3"

[input]
# Where the keyboard and mouse are at startup (`a` or `b`), until the hub decides.
keyboard = "a"

# The keyboard and mouse that travel on the USB-C hub, by VID:PID (on Windows, Device
# Manager; on macOS, System Information → USB). The keyboard is on the machine where they
# show up. Without this section the roles do not change by themselves.
[input.hub]
keyboard = "046d:c33f"
mouse = "046d:c539"

# Cmd↔Ctrl between macOS and Windows is already the default (between two identical systems
# nothing is remapped); to change it, one table per direction with the eight modifiers, for
# example [input.remap.mac_to_win] meta_left = "control_left", ...

# Which machine is each side: the agent fills it in with what each one announces, and the
# name and color are changed from the UI. It belongs to the desk: the same on both machines.
[machines.a]
os = "macos"
name = "MacBook Pro"
color = "#7aa7e6"

[machines.b]
os = "windows"
name = "Tower"
color = "#a99be8"

# The screen arrangement for the keyboard and mouse (DESIGN §7). It belongs to the desk:
# the same on both machines, and it syncs by itself. Each screen uses the native cursor
# coordinates of its machine: points on macOS, physical pixels of the virtual desktop on
# Windows. Without [[screens]] for a machine, the ones it reads itself apply.
[[screens]]
machine = "b"
id = "34"
x = 0
y = 0
width = 3440
height = 1440
scale = 1.0

[[screens]]
machine = "b"
id = "32"
x = 3440
y = 0
width = 3840
height = 2160
# Windows at 150 %: the arrangement carries the scale of each screen.
scale = 1.5

[[screens]]
machine = "a"
id = "34"
x = 0
y = 0
width = 3440
height = 1440

# Which side of B A is on (left, right, up, down) and how they line up (start, center, end).
# Without this section, A is to the left of B and the whole edge crosses.
[arrangement]
a_side = "left"
align = "center"

# Locks the cursor on the machine where it is (KeyboardEvent.code names, all at the same
# time). ScrollLock on a PC keyboard reaches macOS as F14 and counts the same.
[shortcuts]
lock = ["ScrollLock"]

# Keyboard and mouse: Cmd↔Ctrl between macOS and Windows, and dragging files. Sharing the
# clipboard is a module of each machine: turn it off with `[modules.<side>] clipboard = false`.
[prefs]
cmd_ctrl = true
drag_files = true
