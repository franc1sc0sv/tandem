# tandem.toml de la PC. Va en %APPDATA%\Tandem\tandem.toml (o donde diga
# `tandemd --config`). Se valida con `tandemd --check-config <archivo>`.
#
# No hace falta escribirlo: si no existe, tandemd lo genera al arrancar con los
# monitores que detecta (T-082). Este ejemplo muestra todas las opciones, para editarlo.
#
# El puesto ([[monitors]]) es el mismo que en la Mac; cambian `machine` y las
# direcciones del otro agente.
#
# En el directorio de datos el agente guarda:
# - identity.key: su llave Ed25519. Se crea sola la primera vez; no se comparte.
# - trust.toml: las llaves de los pares emparejados. Sin par, el agente trabaja solo
#   y la UI lo indica. Se llena al emparejar desde la UI (píldora del enlace →
#   «Emparejar», en las dos máquinas, y comparar el código).

machine = "pc"

[network]
port = 52000
# Donde esta PC espera a la Mac mientras se empareja (por omisión, port + 1).
# pairing_port = 52001
# La Mac en cada enlace directo (DESIGN §6). La LAN de casa se descubre por mDNS.
peers = [
    { kind = "usb4", addr = "10.77.1.1:52000" },
    { kind = "ethernet", addr = "10.77.2.1:52000" },
]

[input]
# Dónde está el teclado y el mouse al arrancar, hasta que el hub decida (DESIGN §7).
keyboard = "mac"
# Bloquea el cursor en la máquina donde está (nombres de KeyboardEvent.code, todas a
# la vez). ScrollLock de un teclado de PC llega a la Mac como F14 y vale igual.
lock_shortcut = ["ScrollLock"]
clipboard = true

# El teclado y el mouse que viajan en el hub USB-C, por VID:PID (en Windows, el
# Administrador de dispositivos; en macOS, Información del sistema → USB). El teclado está
# en la máquina donde aparecen. Sin esta sección los roles no cambian solos.
[input.hub]
keyboard = "046d:c33f"
mouse = "046d:c539"

# Cmd↔Ctrl ya es lo predeterminado; para cambiarlo, una tabla por dirección con los ocho
# modificadores, por ejemplo [input.remap.mac_to_win] meta_left = "control_left", ...

[[monitors]]
id = "m34"
label = '34"'
edid_model = "LC34G55T"
wiring = { pc = "displayport", mac = "hdmi" }
ddc = { hdmi = 0x06, display_port = 0x09 }

[[monitors]]
id = "m32"
label = '32"'
# El EDID solo dice "Odyssey G5" (id PnP SAM7489); códigos DDC verificados en T-050.
edid_model = "Odyssey G5"
wiring = { pc = "displayport", mac = "hdmi" }
ddc = { hdmi = 0x05, display_port = 0x0F }
