# tandem.toml de una PC con Windows. Va en %APPDATA%\Tandem\tandem.toml (o donde diga
# `tandemd --config`). Se valida con `tandemd --check-config <archivo>`.
#
# No hace falta escribirlo: si no existe, tandemd lo genera al arrancar con el puesto
# vacío (T-082), y todo se configura desde la UI (DECISIONS D4). Este ejemplo muestra
# todas las opciones.
#
# Es la otra mitad del puesto de tandem.mac.toml: el puesto ([machines], [[screens]],
# [arrangement]) es el mismo; cambian `machine`, las direcciones de la otra máquina y
# cómo despertarla. Por las claves, en este ejemplo la PC quedó como `b`.
#
# El formato de v0.2, con lados `mac`/`pc`, sigue cargando: se traduce solo
# (ejemplos en docs/examples/v0.2/).

machine = "b"

[network]
port = 52000
# Donde espera mientras se empareja (por omisión, port + 1).
# pairing_port = 52001
# La otra máquina en cada enlace directo (DESIGN §6). La LAN de casa se descubre por mDNS.
peers = [
    { kind = "usb4", addr = "10.77.1.1:52000" },
    { kind = "ethernet", addr = "10.77.2.1:52000" },
]

[input]
# Dónde está el teclado y el mouse al arrancar (`a` o `b`), hasta que el hub decida.
keyboard = "a"
# Bloquea el cursor en la máquina donde está (nombres de KeyboardEvent.code, todas a
# la vez). ScrollLock de un teclado de PC llega a macOS como F14 y vale igual.
lock_shortcut = ["ScrollLock"]
clipboard = true

# El teclado y el mouse que viajan en el hub USB-C, por VID:PID. El teclado está en la
# máquina donde aparecen. Sin esta sección los roles no cambian solos.
[input.hub]
keyboard = "046d:c33f"
mouse = "046d:c539"

# Cmd↔Ctrl entre macOS y Windows ya es lo predeterminado (entre dos sistemas iguales no se
# reasigna nada); para cambiarlo, una tabla por dirección con los ocho modificadores, por
# ejemplo [input.remap.win_to_mac] control_left = "meta_left", ...

[machines.a]
os = "macos"
name = "MacBook Pro"
color = "#7aa7e6"

[machines.b]
os = "windows"
name = "Torre"
color = "#a99be8"

# El acomodo de pantallas (DESIGN §7): el mismo que en la otra máquina.
[[screens]]
machine = "b"
id = "34"
x = 0
y = 0
width = 3440
height = 1440
scale = 1.0

[[screens]]
machine = "b"
id = "32"
x = 3440
y = 0
width = 3840
height = 2160
# Windows al 150 %: el acomodo lleva la escala de cada pantalla.
scale = 1.5

[[screens]]
machine = "a"
id = "34"
x = 0
y = 0
width = 3440
height = 1440

# De qué lado de B está A (sin esta sección, a la izquierda).
[arrangement]
a_side = "left"
offset = 0
