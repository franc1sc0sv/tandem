[package]
name = "tandem-input"
description = "Motor de teclado y mouse: captura, inyección, mapa de teclas, bordes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
keycode.workspace = true
serde.workspace = true
tandem-core = { path = "../tandem-core" }
tandem-link = { path = "../tandem-link" }
tandem-proto = { path = "../tandem-proto" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
toml.workspace = true
