[package]
name = "tandemd"
description = "Binario del agente (servicio launchd / Windows Service)"
version.workspace = true
edition.workspace = true
license.workspace = true
# `tandemw` es el lanzador sin consola para el arranque con la sesión de Windows.
default-run = "tandemd"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tandem-clipboard = { path = "../tandem-clipboard" }
tandem-core = { path = "../tandem-core" }
tandem-display = { path = "../tandem-display" }
tandem-input = { path = "../tandem-input" }
tandem-link = { path = "../tandem-link" }
tandem-peripherals = { path = "../tandem-peripherals" }
tandem-power = { path = "../tandem-power" }
tandem-proto = { path = "../tandem-proto" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
