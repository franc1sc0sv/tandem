[package]
name = "tandem-cli"
description = "`tandem`: CLI y servidor MCP (stdio) de los túneles; clientes de la IPC del agente"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tandem"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tandem-core = { path = "../tandem-core" }
tandem-proto = { path = "../tandem-proto" }
tandemd = { path = "../tandemd" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "time"] }

[dev-dependencies]
proptest.workspace = true
tandem-link = { path = "../tandem-link" }
tandem-tunnel = { path = "../tandem-tunnel" }
# Los agentes de prueba se compilan con los backends simulados.
tandemd = { path = "../tandemd", features = ["sim-backends"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
