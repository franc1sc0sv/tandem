[package]
name = "tandem-sim"
description = "Simulación del puesto para pruebas: dos agentes en un proceso con backends simulados y fallos inyectados"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
monitor-ddc.workspace = true
tandem-core = { path = "../tandem-core" }
tandem-input = { path = "../tandem-input" }
tandem-link = { path = "../tandem-link" }
tandem-monitor = { path = "../tandem-monitor" }
tandem-proto = { path = "../tandem-proto" }
tandemd = { path = "../tandemd" }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time", "test-util"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tandem-peripherals = { path = "../tandem-peripherals" }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
