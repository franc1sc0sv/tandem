[package]
name = "tandem-clipboard"
description = "Sincronización del portapapeles"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard.workspace = true
serde.workspace = true
sha2.workspace = true
tandem-link = { path = "../tandem-link" }
tandem-proto = { path = "../tandem-proto" }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }

[dev-dependencies]
proptest.workspace = true
tandem-core = { path = "../tandem-core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
