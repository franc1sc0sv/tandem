[package]
name = "tandem-display"
description = "Trait MonitorSwitcher + backends (ddc-windows, ddc-macos, manual, kvm); trait DisplayTopology + backends (windows, macos)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tandem-ddc"
path = "src/bin/tandem-ddc.rs"

[dependencies]
anyhow.workspace = true
# Directorio de datos de `tandem-ddc`, donde viven los perfiles del usuario.
dirs.workspace = true
serde.workspace = true
tandem-core = { path = "../tandem-core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
