[package]
name = "tandem-files"
description = "Archivos y puertos por túnel: fragmentos con BLAKE3, reanudables, y reenvío de puertos TCP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
getrandom.workspace = true
serde = { workspace = true }
tandem-proto = { path = "../tandem-proto" }
tandem-tunnel = { path = "../tandem-tunnel" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSColor"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGEventSource", "CGEventTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSGeometry", "NSEnumerator", "NSString", "NSURL", "NSObject"] }

[dev-dependencies]
proptest.workspace = true
tandem-core = { path = "../tandem-core" }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
